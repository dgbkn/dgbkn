name: Update stats cards

on:
  schedule:
    # Every Monday at 03:00 UTC (once every 7 days)
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Generate the stats cards
        env:
          # Use STATS_TOKEN (a personal access token) when it is set, so private
          # contributions and languages are included. Otherwise fall back to the
          # built-in token, which can only read public data.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python3 scripts/generate_stats.py

      - name: Commit the updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update stats cards"
            git push
          fi
